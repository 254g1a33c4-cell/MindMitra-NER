function overallLevelLabel(){ return levelLabelFor(state.gameStats); }
function levelLabelFor(gs){
  var ids = Object.keys(gs || {});
  if(!ids.length) return "—";
  var avg = ids.reduce(function(a,id){return a+(gs[id].unlockedLevel||1);},0)/ids.length;
  var lvl = Math.max(1, Math.round(avg));
  return t("difficultyLabel")+' '+lvl+'/5 · '+t(levelDifficultyKey(lvl));
}
function capitalize(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]; }); }

/* ============================= CAREGIVER PATIENT HISTORY ============================= */
/* "Previous Patients" — a caregiver-only roster of patients previously added on this
   device, scoped to the signed-in caregiver via their Firebase UID (state.auth.uid).
   Existing single-active-
   patient game/dashboard code is untouched: switching patients simply swaps the live
   state.gameStats/sessions/reminders/etc. for the chosen record's saved snapshot, and
   syncActivePatientSnapshot() (called from saveState()) keeps that record's snapshot
   fresh while it's the active one. */
function switchToPatient(id){
  syncActivePatientSnapshot();
  var rec = state.patients.find(function(p){ return p.id === id; });
  if(!rec) return;
  clearGameTimer(); state.activeGame = null;
  state.patient = {id:rec.id, name:rec.name, age:rec.age, problemKey:rec.problemKey, caregiverName:rec.caregiverName, caregiverPhone:rec.caregiverPhone};
  state.lang = rec.lang || state.lang;
  state.recommendations = (rec.recommendations && rec.recommendations.length) ? rec.recommendations : getRecommendations(rec.problemKey);
  state.gameStats = rec.gameStats ? JSON.parse(JSON.stringify(rec.gameStats)) : defaultState().gameStats;
  state.sessions = rec.sessions ? JSON.parse(JSON.stringify(rec.sessions)) : [];
  state.completedToday = rec.completedToday ? rec.completedToday.slice() : [];
  state.reminders = rec.reminders ? JSON.parse(JSON.stringify(rec.reminders)) : [];
  goToView("patientDashboard");
  saveState(); render();
}
function loadDemoPatients(){
  // Clearly-labelled (isDemo:true), editable sample records for demoing the
  // feature when a caregiver has no real patients saved yet. Never presented
  // as real patients — every render checks rec.isDemo and shows a DEMO badge.
  var demoDefs = [
    {name:"Ramesh Kumar", age:"72", problemKey:"memory", level:3, completions:2},
    {name:"Sita Devi", age:"68", problemKey:"general", level:2, completions:1}
  ];
  demoDefs.forEach(function(d, idx){
    var gs = JSON.parse(JSON.stringify(defaultState().gameStats));
    var ids = Object.keys(gs);
    ids.forEach(function(id){ gs[id].unlockedLevel = d.level; });
    ids.slice(0,3).forEach(function(id){ gs[id].completions = d.completions; });
    state.patients.push({
      id:"demo"+Date.now()+"_"+idx, caregiverId:state.auth.uid,
      name:d.name, age:d.age, problemKey:d.problemKey,
      caregiverName:state.auth.name || "", caregiverPhone:"", lang:state.lang,
      dateAdded:todayKey(), lastAssessment:todayKey(),
      recommendations:getRecommendations(d.problemKey),
      gameStats:gs, sessions:[], completedToday:[], reminders:[],
      isDemo:true
    });
  });
  saveState(); render();
}

/* ============================= GAME ENGINE (shared) ============================= */
var EMOJI_POOL = ["🍎","🍌","🐶","🐱","🌞","🌸","🚗","⭐","🎈","🐦","🍊","🥕","🍇","🐘","🌙","☂️"];
var SHAPE_POOL = ["🔵","🔺","🟩","🟡","🔶","🟣","🔷","🟢","🟠","🟥","⬛","⬜"];
var WORD_BANK = [
  {en:"Apple", hi:"सेब", emoji:"🍎"}, {en:"Dog", hi:"कुत्ता", emoji:"🐶"},
  {en:"Sun", hi:"सूरज", emoji:"☀️"}, {en:"House", hi:"घर", emoji:"🏠"},
  {en:"Flower", hi:"फूल", emoji:"🌸"}, {en:"Car", hi:"कार", emoji:"🚗"},
  {en:"Star", hi:"तारा", emoji:"⭐"}, {en:"Bird", hi:"चिड़िया", emoji:"🐦"},
  {en:"Fish", hi:"मछली", emoji:"🐟"}, {en:"Tree", hi:"पेड़", emoji:"🌳"},
  {en:"Moon", hi:"चाँद", emoji:"🌙"}, {en:"Ball", hi:"गेंद", emoji:"⚽"},
  {en:"Chair", hi:"कुर्सी", emoji:"🪑"}, {en:"Book", hi:"किताब", emoji:"📖"}
];
var OBJECT_POOL = ["🍎","🍌","🐶","🐱","🌞","🌸","🚗","⭐","🎈","🐦","🍊","🥕","🍇","🐘","🌙","☂️","🍉","🍓","🐝","🦋"];

/* ---- Level / timer control (shared by every game) ---- */
var gameTimerHandle = null;
function clearGameTimer(){ if(gameTimerHandle){ clearInterval(gameTimerHandle); gameTimerHandle=null; } }

function startLevel(gameId, level){
  clearGameTimer();
  level = Math.max(1, Math.min(5, level || state.gameStats[gameId].unlockedLevel || 1));
  var g = {
    id:gameId, level:level, correct:0, mistakes:0, unitsCompleted:0,
    timeLeft:LEVEL_SECONDS, phase:"playing", roundState:null, lastFeedback:null
  };
  state.activeGame = g;
  goToView("game");
  setupUnit(g);
  afterSetupUnit(g);
  render();
  gameTimerHandle = setInterval(function(){
    if(!state.activeGame || state.activeGame!==g || g.phase!=="playing"){ clearGameTimer(); return; }
    g.timeLeft--;
    if(g.timeLeft<=0){ g.timeLeft=0; endLevel(g); }
    else render();
  }, 1000);
}

function setupUnit(g){
  g.lastFeedback = null;
  var cfg = LEVEL_CONFIGS[g.id];
  var idx = g.level-1;
  if(g.id==="pictureMatching" || g.id==="memoryMatch"){
    var pool = g.id==="pictureMatching" ? EMOJI_POOL : SHAPE_POOL;
    var pairs = cfg.pairs[idx];
    var chosen = pool.slice(0,pairs);
    var cards = chosen.concat(chosen).map(function(e,i){ return {id:i, emoji:e, matched:false}; });
    shuffle(cards);
    g.roundState = {cards:cards, flipped:[], pairs:pairs, matchedCount:0};
  } else if(g.id==="memorySequence"){
    var len = cfg.seqLen[idx];
    var colors = ["red","blue","green","yellow"];
    var seq = []; for(var i=0;i<len;i++){ seq.push(colors[Math.floor(Math.random()*4)]); }
    g.roundState = {sequence:seq, phase:"idle", showIndex:0, userIndex:0, lit:null};
  } else if(g.id==="patternRecall"){
    var count = cfg.cells[idx];
    var allCells = [0,1,2,3,4,5,6,7,8];
    var pattern = shuffle(allCells.slice()).slice(0,count).sort(function(a,b){return a-b;});
    g.roundState = {pattern:pattern, phase:"showing", selected:[], total:9};
  } else if(g.id==="wordPictureMatching"){
    var numOptions = cfg.options[idx];
    var target = WORD_BANK[Math.floor(Math.random()*WORD_BANK.length)];
    var options = [target];
    while(options.length<numOptions){
      var cand = WORD_BANK[Math.floor(Math.random()*WORD_BANK.length)];
      if(!options.find(function(o){return o.en===cand.en;})) options.push(cand);
    }
    shuffle(options);
    g.roundState = {target:target, options:options, answered:false};
  } else if(g.id==="wordRecall"){
    var wc = cfg.words[idx];
    var viewSecs = cfg.viewSeconds[idx];
    var pool2 = shuffle(WORD_BANK.slice());
    var chosenWords = pool2.slice(0,wc);
    var decoyPool = pool2.slice(wc);
    var decoys = decoyPool.slice(0, Math.min(decoyPool.length, wc));
    var optionPool = shuffle(chosenWords.concat(decoys));
    var rs = {words:chosenWords, options:optionPool, picked:[], phase:"memorize", viewSeconds:viewSecs};
    g.roundState = rs;
    setTimeout(function(){
      if(state.activeGame!==g || g.roundState!==rs || g.phase!=="playing") return;
      rs.phase = "recall";
      render();
    }, viewSecs*1000);
  } else if(g.id==="findObject"){
    var size = cfg.size[idx], cols = cfg.cols[idx];
    var target2 = OBJECT_POOL[Math.floor(Math.random()*OBJECT_POOL.length)];
    var distractors = OBJECT_POOL.filter(function(o){return o!==target2;});
    var cells2 = []; var targetPos = Math.floor(Math.random()*size);
    for(var j=0;j<size;j++){ cells2.push(j===targetPos ? target2 : distractors[Math.floor(Math.random()*distractors.length)]); }
    g.roundState = {target:target2, cells:cells2, answered:false, cols:cols};
  } else if(g.id==="numberSequence"){
    var n = cfg.n[idx];
    var nums = []; for(var k=1;k<=n;k++) nums.push(k);
    shuffle(nums);
    g.roundState = {nums:nums, next:1, max:n, done:[]};
  }
}

function afterSetupUnit(g){
  if(g.id==="memorySequence") beginSequencePlayback(g);
  else if(g.id==="patternRecall") beginPatternReveal(g);
}

/* Called whenever the player finishes one "unit" (a matched pair set, a
   sequence, a word question, a grid tap, a full number set, a pattern, or a
   recall check) — win or lose. Keeps the level going by generating a fresh
   unit immediately, for as long as time remains. */
function unitComplete(g){
  if(!g || state.activeGame!==g || g.phase!=="playing") return;
  g.unitsCompleted++;
  if(g.timeLeft<=0) return; // the 1s timer tick will end the level
  setupUnit(g);
  afterSetupUnit(g);
  render();
}

function shuffle(arr){ for(var i=arr.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp; } return arr; }

function renderGameView(){
  var g = state.activeGame;
  var def = GAME_DEFS[g.id];
  if(g.phase==="levelComplete"){ return renderLevelComplete(g); }

  var boardHtml = "";
  if(g.id==="pictureMatching" || g.id==="memoryMatch") boardHtml = renderCardFlip(g);
  else if(g.id==="memorySequence") boardHtml = renderMemorySequence(g);
  else if(g.id==="patternRecall") boardHtml = renderPatternRecall(g);
  else if(g.id==="wordPictureMatching") boardHtml = renderWordPicture(g);
  else if(g.id==="wordRecall") boardHtml = renderWordRecall(g);
  else if(g.id==="findObject") boardHtml = renderFindObject(g);
  else if(g.id==="numberSequence") boardHtml = renderNumberSequence(g);

  var feedback = g.lastFeedback ? '<div class="feedback-banner '+(g.lastFeedback==="good"?"good":"bad")+'">'+(g.lastFeedback==="good"?t("feedbackCorrect"):t("feedbackIncorrect"))+'</div>' : "";
  var timerLow = g.timeLeft<=10;

  return (
    topbar("patient") +
    '<div class="wrap narrow">' +
      '<div class="card">' +
        '<div class="game-header">' +
          '<h2>'+def.icon+' '+t(def.nameKey)+'</h2>' +
          '<div class="game-stats">' +
            '<span class="stat-chip">'+t("levelXofY",{a:g.level})+' ('+t(levelDifficultyKey(g.level))+')</span>' +
            '<span class="stat-chip timer-chip'+(timerLow?" low":"")+'">⏱ '+t("timeLabel")+': '+g.timeLeft+'s</span>' +
          '</div>' +
        '</div>' +
        '<div class="game-stats" style="margin-bottom:10px;">' +
          '<span class="stat-chip">'+t("scoreLabel")+': '+(g.correct*10 - g.mistakes*2 > 0 ? g.correct*10 - g.mistakes*2 : 0)+'</span>' +
          '<span class="stat-chip">'+t("correctLabel")+': '+g.correct+'</span>' +
          '<span class="stat-chip">'+t("wrongLabel")+': '+g.mistakes+'</span>' +
        '</div>' +
        '<div class="instr-box"><span>'+t(def.instrKey)+'</span>' +
          '<button class="listen-btn" data-action="speakInstr">'+t("btnListen")+'</button></div>' +
        '<div class="board">'+boardHtml+'</div>' +
        feedback +
        '<div class="flex-between" style="margin-top:20px;">' +
          '<button class="btn btn-ghost" data-action="restartGame">'+t("restartLabel")+'</button>' +
          '<button class="btn btn-outline" data-action="backToDashboard">'+t("btnBackDashboard")+'</button>' +
        '</div>' +
      '</div>' +
    '</div>' +
    footerDisclaimer()
  );
}

function renderLevelComplete(g){
  var def = GAME_DEFS[g.id];
  var score = Math.max(0, g.correct*10 - g.mistakes*2);
  var isLast = g.level>=5;
  return (
    topbar("patient") +
    '<div class="wrap narrow">' +
      '<div class="card center">' +
        '<h2>⏱ '+t("gameOverLabel")+'</h2>' +
        '<div class="results-score"><div class="num">'+score+'</div><p class="muted">'+def.icon+' '+t(def.nameKey)+' — '+t("levelXofY",{a:g.level})+'</p></div>' +
        '<p>'+t("correctLabel")+': '+g.correct+' &nbsp;•&nbsp; '+t("wrongLabel")+': '+g.mistakes+' &nbsp;•&nbsp; '+t("completedLabel")+' ✅</p>' +
        (isLast ? '<div class="adaptive-msg">'+t("allLevelsDone")+'</div>' : '') +
        '<div class="stack-gap">' +
          (isLast ? '' : '<button class="btn btn-primary btn-block btn-lg" data-action="nextLevel" data-game="'+g.id+'" data-level="'+(g.level+1)+'">'+t("nextLevelLabel")+'</button>') +
          '<button class="btn btn-ghost btn-block" data-action="playAgainSame" data-game="'+g.id+'" data-level="'+g.level+'">'+t("restartLabel")+'</button>' +
          '<button class="btn btn-outline btn-block" data-action="openGameMenu">'+t("chooseAnother")+'</button>' +
          '<button class="btn btn-outline btn-block" data-action="backToDashboard">'+t("backToDashboard")+'</button>' +
        '</div>' +
      '</div>' +
    '</div>' +
    footerDisclaimer()
  );
}

function endLevel(g){
  if(!g || state.activeGame!==g) return;
  clearGameTimer();
  g.phase = "levelComplete";
  var score = Math.max(0, g.correct*10 - g.mistakes*2);
  var stat = state.gameStats[g.id];
  stat.bestScores[g.level-1] = Math.max(stat.bestScores[g.level-1]||0, score);
  stat.completions++;
  if(g.level < 5) stat.unlockedLevel = Math.max(stat.unlockedLevel, g.level+1);
  if(state.completedToday.indexOf(g.id)===-1) state.completedToday.push(g.id);
  var accuracyForChart = (g.correct+g.mistakes)>0 ? g.correct/(g.correct+g.mistakes) : 0;
  state.sessions.push({date:todayKey(), gameId:g.id, accuracy:accuracyForChart, avgResponseTime:LEVEL_SECONDS/Math.max(g.unitsCompleted,1), timestamp:Date.now()});
  saveState();
  render();
}

/* ---- Card flip (Picture Matching + Memory Match share this) ---- */
function renderCardFlip(g){
  var rs = g.roundState;
  var cols = rs.pairs<=3?3:(rs.pairs===4?4:(rs.pairs<=6?4:5));
  var cards = rs.cards.map(function(c, idx){
    var revealed = rs.flipped.indexOf(idx)!==-1 || c.matched;
    var cls = "flip-card"+(revealed?" revealed":"")+(c.matched?" matched":"");
    return '<button class="'+cls+'" data-action="flipCard" data-idx="'+idx+'">'+(revealed?c.emoji:"❔")+'</button>';
  }).join("");
  return '<div class="card-grid" style="grid-template-columns:repeat('+cols+',1fr);">'+cards+'</div>';
}
function flipCard(idx){
  if(!state.activeGame || state.activeGame.phase!=="playing") return;
  var g = state.activeGame, rs = g.roundState;
  if(rs.flipped.length>=2) return;
  if(rs.flipped.indexOf(idx)!==-1) return;
  if(rs.cards[idx].matched) return;
  rs.flipped.push(idx);
  if(rs.flipped.length===2){
    render();
    setTimeout(function(){
      if(state.activeGame!==g) return;
      var a = rs.cards[rs.flipped[0]], b = rs.cards[rs.flipped[1]];
      if(a.emoji===b.emoji){
        a.matched = true; b.matched = true; rs.matchedCount++;
        g.correct++; g.lastFeedback="good";
      } else {
        g.mistakes++; g.lastFeedback="bad";
      }
      rs.flipped = [];
      if(rs.matchedCount===rs.pairs){ unitComplete(g); }
      else render();
    }, 700);
    return;
  }
  render();
}

/* ---- Memory Sequence ---- */
function renderMemorySequence(g){
  var rs = g.roundState;
  var pads = ["red","blue","green","yellow"];
  var buttons = pads.map(function(color){
    var lit = rs.lit===color ? " lit" : "";
    return '<button class="pad-btn pad-'+color+lit+'" data-action="padTap" data-color="'+color+'" '+(rs.phase!=="input"?"disabled":"")+'></button>';
  }).join("");
  var msg = rs.phase==="showing" ? t("watchClosely") : t("yourTurn");
  return '<p class="center muted" style="margin-bottom:14px;">'+msg+'</p><div class="pad-grid">'+buttons+'</div>';
}
function beginSequencePlayback(g){
  var rs = g.roundState;
  rs.phase = "showing"; rs.showIndex = 0; rs.lit = null;
  function step(){
    if(state.activeGame!==g || g.roundState!==rs) return;
    if(rs.showIndex >= rs.sequence.length){
      rs.lit = null; rs.phase = "input"; rs.userIndex = 0;
      render();
      return;
    }
    rs.lit = rs.sequence[rs.showIndex];
    render();
    setTimeout(function(){
      if(state.activeGame!==g || g.roundState!==rs) return;
      rs.lit = null; render();
      setTimeout(function(){ if(state.activeGame===g && g.roundState===rs){ rs.showIndex++; step(); } }, 250);
    }, 650);
  }
  setTimeout(step, 400);
}
function padTap(color){
  if(!state.activeGame || state.activeGame.phase!=="playing") return;
  var g = state.activeGame, rs = g.roundState;
  if(rs.phase!=="input") return;
  if(rs.sequence[rs.userIndex]===color){
    rs.userIndex++;
    if(rs.userIndex>=rs.sequence.length){ g.correct++; g.lastFeedback="good"; unitComplete(g); return; }
    render();
  } else {
    g.mistakes++; g.lastFeedback="bad"; unitComplete(g);
  }
}

/* ---- Pattern Recall (spatial grid, shown all at once) ---- */
function renderPatternRecall(g){
  var rs = g.roundState;
  var msg = rs.phase==="showing" ? t("patternShowMsg") : t("patternRecallMsg");
  var cells = [];
  for(var i=0;i<rs.total;i++){
    var lit = rs.phase==="showing" && rs.pattern.indexOf(i)!==-1;
    var picked = rs.phase==="input" && rs.selected.indexOf(i)!==-1;
    var cls = "find-cell" + (lit?" right":"") + (picked?" right":"");
    cells.push('<button class="'+cls+'" data-action="patternTap" data-idx="'+i+'" '+(rs.phase!=="input"?"disabled":"")+'></button>');
  }
  return '<p class="center muted" style="margin-bottom:14px;">'+msg+'</p>' +
    '<div class="find-grid" style="grid-template-columns:repeat(3,1fr);max-width:280px;margin:0 auto;">'+cells.join("")+'</div>';
}
function beginPatternReveal(g){
  var rs = g.roundState;
  rs.phase = "showing"; rs.selected = [];
  render();
  setTimeout(function(){
    if(state.activeGame!==g || g.roundState!==rs) return;
    rs.phase = "input";
    render();
  }, 1600);
}
function patternTap(idx){
  if(!state.activeGame || state.activeGame.phase!=="playing") return;
  var g = state.activeGame, rs = g.roundState;
  if(rs.phase!=="input") return;
  if(rs.selected.indexOf(idx)!==-1) return;
  rs.selected.push(idx);
  if(rs.selected.length >= rs.pattern.length){
    var correctSet = rs.pattern.slice().sort().join(",");
    var pickedSet = rs.selected.slice().sort().join(",");
    if(correctSet===pickedSet){ g.correct++; g.lastFeedback="good"; }
    else { g.mistakes++; g.lastFeedback="bad"; }
    render();
    setTimeout(function(){ unitComplete(g); }, 500);
  } else {
    render();
  }
}

/* ---- Word–Picture Matching ---- */
function renderWordPicture(g){
  var rs = g.roundState;
  var word = state.lang==="hi" ? rs.target.hi : rs.target.en;
  var options = rs.options.map(function(o){
    var cls = "option-btn";
    if(rs.answered){ cls += o===rs.target ? " correct" : ""; }
    return '<button class="'+cls+'" data-action="wordAnswer" data-word="'+encodeURIComponent(o.en)+'" '+(rs.answered?"disabled":"")+'><span>'+o.emoji+'</span></button>';
  }).join("");
  return '<div class="word-display">'+word+'</div><div class="option-grid">'+options+'</div>';
}
function wordAnswer(enName){
  if(!state.activeGame || state.activeGame.phase!=="playing") return;
  var g = state.activeGame, rs = g.roundState;
  if(rs.answered) return;
  rs.answered = true;
  if(enName===rs.target.en){ g.correct++; g.lastFeedback="good"; } else { g.mistakes++; g.lastFeedback="bad"; }
  render();
  setTimeout(function(){ unitComplete(g); }, 700);
}

/* ---- Word Recall (memorize, then recognize) ---- */
function renderWordRecall(g){
  var rs = g.roundState;
  if(rs.phase==="memorize"){
    var shown = rs.words.map(function(w){
      var word = state.lang==="hi" ? w.hi : w.en;
      return '<span class="pill" style="font-size:1.1rem;margin:4px;">'+w.emoji+' '+word+'</span>';
    }).join("");
    return '<p class="center" style="margin-bottom:10px;font-weight:800;">'+t("memorizeInstruction")+'</p>' +
      '<div class="center">'+shown+'</div>';
  }
  var options = rs.options.map(function(o){
    var word = state.lang==="hi" ? o.hi : o.en;
    var picked = rs.picked.indexOf(o.en)!==-1;
    return '<button class="option-btn" style="font-size:1.05rem;" data-action="wordRecallPick" data-word="'+encodeURIComponent(o.en)+'"><span>'+o.emoji+'</span><span>'+word+'</span>'+(picked?" ✓":"")+'</button>';
  }).join("");
  return '<p class="center" style="margin-bottom:10px;font-weight:700;">'+t("recallInstruction")+'</p>' +
    '<div class="option-grid">'+options+'</div>' +
    '<div class="center" style="margin-top:16px;"><button class="btn btn-primary" data-action="wordRecallSubmit">'+t("btnSubmitRecall")+'</button></div>';
}
function wordRecallPick(enName){
  if(!state.activeGame || state.activeGame.phase!=="playing") return;
  var g = state.activeGame, rs = g.roundState;
  if(rs.phase!=="recall") return;
  var idx = rs.picked.indexOf(enName);
  if(idx===-1) rs.picked.push(enName); else rs.picked.splice(idx,1);
  render();
}
function wordRecallSubmit(){
  if(!state.activeGame || state.activeGame.phase!=="playing") return;
  var g = state.activeGame, rs = g.roundState;
  if(rs.phase!=="recall") return;
  var correctWords = rs.words.map(function(w){return w.en;});
  var allRight = rs.picked.length===correctWords.length && rs.picked.every(function(p){return correctWords.indexOf(p)!==-1;});
  if(allRight){ g.correct++; g.lastFeedback="good"; } else { g.mistakes++; g.lastFeedback="bad"; }
  unitComplete(g);
}

/* ---- Find the Correct Object ---- */
function renderFindObject(g){
  var rs = g.roundState;
  var cells = rs.cells.map(function(emoji, idx){
    return '<button class="find-cell" data-action="findTap" data-idx="'+idx+'" '+(rs.answered?"disabled":"")+'>'+emoji+'</button>';
  }).join("");
  return '<p class="find-target">'+t("target")+' <span class="tgt">'+rs.target+'</span></p>' +
    '<div class="find-grid" style="grid-template-columns:repeat('+rs.cols+',1fr);">'+cells+'</div>';
}
function findTap(idx){
  if(!state.activeGame || state.activeGame.phase!=="playing") return;
  var g = state.activeGame, rs = g.roundState;
  if(rs.answered) return;
  rs.answered = true;
  if(rs.cells[idx]===rs.target){ g.correct++; g.lastFeedback="good"; } else { g.mistakes++; g.lastFeedback="bad"; }
  render();
  setTimeout(function(){ unitComplete(g); }, 700);
}

/* ---- Number Sequence ---- */
function renderNumberSequence(g){
  var rs = g.roundState;
  var buttons = rs.nums.map(function(n){
    var done = rs.done.indexOf(n)!==-1;
    return '<button class="num-btn'+(done?" done":"")+'" data-action="numTap" data-n="'+n+'" '+(done?"disabled":"")+'>'+n+'</button>';
  }).join("");
  return '<div class="num-grid">'+buttons+'</div>';
}
function numTap(n){
  if(!state.activeGame || state.activeGame.phase!=="playing") return;
  var g = state.activeGame, rs = g.roundState;
  if(rs.done.indexOf(n)!==-1) return;
  if(n===rs.next){
    rs.done.push(n); rs.next++; g.correct++; g.lastFeedback="good";
    if(rs.next>rs.max){ unitComplete(g); return; }
    render();
  } else {
    g.mistakes++; g.lastFeedback="bad"; render();
  }
}

/* ============================= EVENT DELEGATION ============================= */
function afterRender(){
  /* Progressive enhancement only: scroll-reveal + benchmark bar fill.
     Nothing here is required for the app to function — if IntersectionObserver
     is unavailable, .reveal elements are simply always visible (see CSS). */
  try{
    var revealEls = app.querySelectorAll(".reveal");
    if(revealEls.length){
      if("IntersectionObserver" in window){
        var io = new IntersectionObserver(function(entries){
          entries.forEach(function(entry){
            if(entry.isIntersecting){
              entry.target.classList.add("in-view");
              io.unobserve(entry.target);
            }
          });
        }, {threshold:0.15});
        revealEls.forEach(function(el){ io.observe(el); });
      } else {
        revealEls.forEach(function(el){ el.classList.add("in-view"); });
      }
    }
    var benchEls = app.querySelectorAll(".js-bench");
    if(benchEls.length){
      benchEls.forEach(function(el){
        var pct = el.getAttribute("data-pct") || "0";
        setTimeout(function(){ el.style.width = pct + "%"; }, 120);
      });
    }
  } catch(e){ /* progressive enhancement — safe to ignore */ }
}

app.addEventListener("click", function(e){
  var el = e.target.closest("[data-action]");
  if(!el) return;
  var action = el.getAttribute("data-action");
  switch(action){
    /* ---------------- ADDED: Firebase authentication actions ---------------- */
    case "splashContinue":
    case "goSignup":
      state.authMode = "signup"; state.authMsg = null; state.authBusy = false; state.mobileNavOpen = false;
      goToView("signup"); render();
      break;
    case "goLogin":
      state.authMode = "login"; state.authMsg = null; state.authBusy = false; state.mobileNavOpen = false;
      goToView("login"); render();
      break;
    case "backHome":
      state.authMsg = null; state.authBusy = false;
      goToView("splash"); render();
      break;
    case "openDashboard":
      state.mobileNavOpen = false;
      goToView(state.patient ? "caregiverDashboard" : "setup");
      render();
      break;
    case "doSignup": doSignup(); break;
    case "doLogin": doLogin(); break;
    case "doGoogle": doGoogle(); break;
    case "forgotPassword": forgotPassword(); break;
    case "localPreview": startLocalPreview(); break;
    case "logout": doLogout(); break;
    case "togglePw": {
      var pwTarget = document.getElementById(el.getAttribute("data-target"));
      if(pwTarget){
        var showing = pwTarget.type === "text";
        pwTarget.type = showing ? "password" : "text";
        el.textContent = showing ? t("btnShowPw") : t("btnHidePw");
      }
      break;
    }
    /* ---------------- ADDED: accessibility + mobile navigation ---------------- */
    case "fontSmaller": stepFontSize(-1); break;
    case "fontLarger":  stepFontSize(1);  break;
    case "fontReset":   setFontSize("normal"); break;
    case "toggleMobileNav": state.mobileNavOpen = !state.mobileNavOpen; render(); break;
    case "closeMobileNav": state.mobileNavOpen = false; render(); break;
    case "dismissToast": state.toast = null; renderToast(); break;
    case "addNewPatient":
      if(!state.patient){ goToView("setup"); saveState(); render(); break; }
      if(confirm("Add a new patient? The current patient's profile and progress stay saved under Previous Patients.")){
        clearGameTimer();
        var keepLang = state.lang, keepAuth = state.auth, keepContacts = state.familyContacts, keepPatients = state.patients;
        var keepLocal = state.localMode;
        state = defaultState();
        state.lang = keepLang; state.auth = keepAuth; state.familyContacts = keepContacts;
        state.patients = keepPatients || []; state.loggedIn = true; state.localMode = keepLocal;
        state.isOnline = navigator.onLine; state.splashSpoken = true;
        goToView("setup"); saveState(); render();
      }
      break;
    case "analyze": doAnalyze(); break;
    case "goPatient": if(state.patient){ clearGameTimer(); state.activeGame=null; goToView("patientDashboard"); saveState(); render(); } break;
    case "goCaregiver": if(state.patient){ clearGameTimer(); state.activeGame=null; goToView("caregiverDashboard"); saveState(); render(); } break;
    case "viewPatient":
      state.viewingPatientId = el.getAttribute("data-id");
      goToView("patientProfile");
      render();
      break;
    case "continuePatient": switchToPatient(el.getAttribute("data-id")); break;
    case "loadDemoPatients": loadDemoPatients(); break;
    case "removeDemoPatients":
      if(confirm("Remove all demo patient records? This cannot be undone.")){
        state.patients = state.patients.filter(function(p){ return !p.isDemo; });
        saveState(); render();
      }
      break;
    case "openGameMenu": goToView("gameMenu"); saveState(); render(); break;
    case "chooseGame": {
      var gid = el.getAttribute("data-game");
      startLevel(gid, state.gameStats[gid].unlockedLevel);
      break;
    }
    case "toggleReminders": state.showReminderPanel = !state.showReminderPanel; render(); break;
    case "toggleFamilyPanel": state.showFamilyPanel = !state.showFamilyPanel; render(); break;
    case "toggleEmergencyPanel": state.showEmergencyPanel = !state.showEmergencyPanel; render(); break;
    case "toggleReminderDone": {
      var rid = el.getAttribute("data-id");
      var today = todayKey();
      var rem = state.reminders.find(function(r){return r.id===rid;});
      if(rem){
        rem.completedDates = rem.completedDates || [];
        var idx = rem.completedDates.indexOf(today);
        if(idx===-1) rem.completedDates.push(today); else rem.completedDates.splice(idx,1);
        saveState(); render();
      }
      break;
    }
    case "flipCard": flipCard(parseInt(el.getAttribute("data-idx"),10)); break;
    case "padTap": padTap(el.getAttribute("data-color")); break;
    case "patternTap": patternTap(parseInt(el.getAttribute("data-idx"),10)); break;
    case "wordAnswer": wordAnswer(decodeURIComponent(el.getAttribute("data-word"))); break;
    case "wordRecallPick": wordRecallPick(decodeURIComponent(el.getAttribute("data-word"))); break;
    case "wordRecallSubmit": wordRecallSubmit(); break;
    case "findTap": findTap(parseInt(el.getAttribute("data-idx"),10)); break;
    case "numTap": numTap(parseInt(el.getAttribute("data-n"),10)); break;
    case "restartGame":
      if(state.activeGame){ startLevel(state.activeGame.id, state.activeGame.level); }
      break;
    case "backToDashboard": clearGameTimer(); state.activeGame=null; goToView("patientDashboard"); saveState(); render(); break;
    case "nextLevel": startLevel(el.getAttribute("data-game"), parseInt(el.getAttribute("data-level"),10)); break;
    case "playAgainSame": startLevel(el.getAttribute("data-game"), parseInt(el.getAttribute("data-level"),10)); break;
    case "speakInstr":
      if(state.activeGame){ speak(t(GAME_DEFS[state.activeGame.id].instrKey)); }
      break;
    case "speakText": speak(el.getAttribute("data-text")); break;
    case "addReminder": {
      var textEl = document.getElementById("rm-text"), timeEl = document.getElementById("rm-time");
      var text = textEl ? textEl.value.trim() : "";
      var time = timeEl ? timeEl.value.trim() : "";
      if(text){
        state.reminders.push({id:"r"+Date.now(), text:text, time:time, completedDates:[], notifiedDates:[]});
        if(time) requestNotificationPermission(); // opt-in prompt, only fires once (permission "default")
        saveState(); render();
      }
      break;
    }
    case "quickAddReminder": {
      var qtext = el.getAttribute("data-text");
      state.reminders.push({id:"r"+Date.now(), text:qtext, time:"", completedDates:[], notifiedDates:[]});
      saveState(); render();
      break;
    }
    case "enableNotifications": requestNotificationPermission(); break;
    case "dismissReminderAlert": state.firingReminder = null; render(); break;
    case "deleteReminder": {
      var id = el.getAttribute("data-id");
      state.reminders = state.reminders.filter(function(r){return r.id!==id;});
      saveState(); render();
      break;
    }
    case "addFamilyContact": {
      var nameEl = document.getElementById("fc-name"), relEl = document.getElementById("fc-relation"), phoneEl = document.getElementById("fc-phone");
      var cname = nameEl ? nameEl.value.trim() : "";
      var crel = relEl ? relEl.value.trim() : "";
      var cphone = phoneEl ? phoneEl.value.trim() : "";
      if(cname && cphone){ state.familyContacts.push({id:"c"+Date.now(), name:cname, relation:crel, phone:cphone}); saveState(); render(); }
      break;
    }
    case "deleteContact": {
      var cid = el.getAttribute("data-id");
      state.familyContacts = state.familyContacts.filter(function(c){return c.id!==cid;});
      saveState(); render();
      break;
    }
    case "voiceCommand": startVoiceCommand(); break;
    case "startOver":
      if(confirm("Start over with a new patient? This clears the current profile and progress, but keeps your caregiver login, family contacts, and previous patient history.")){
        clearGameTimer();
        var lang = state.lang, auth = state.auth, contacts = state.familyContacts, patients = state.patients;
        var wasLocal = state.localMode;
        state = defaultState();
        state.lang = lang; state.auth = auth; state.familyContacts = contacts; state.loggedIn = true;
        state.patients = patients || [];
        state.localMode = wasLocal;
        state.isOnline = navigator.onLine; state.splashSpoken = true;
        goToView("setup");
        saveState(); render();
      }
      break;
  }
});

app.addEventListener("change", function(e){
  if(e.target.matches("select.lang-select")){
    state.lang = e.target.value; saveState(); render();
  }
});

window.addEventListener("online", function(){ state.isOnline = true; render(); });
window.addEventListener("offline", function(){ state.isOnline = false; render(); });

render();
startReminderScheduler();
})();
</script>

<script type="module">
/* MindMate <-> Firebase bridge.
   Exposes a small promise-based API on window.MMFirebase and notifies the main app
   through DOM events, so the (non-module) app script stays exactly as it was.

   Data model
     caregivers/{uid}                      - caregiver profile ({name, email})
     patients/{patientId}                  - one document per patient record,
                                             each carrying caregiverId == the
                                             authenticated caregiver's Firebase UID.
   Passwords are handled entirely by Firebase Authentication. This file never writes a
   password to Firestore, to localStorage, or anywhere else. */

const cfg = window.MINDMATE_FIREBASE_CONFIG || {};
const isPlaceholder = Object.keys(cfg).length === 0 ||
  Object.values(cfg).some(v => typeof v !== "string" || v.indexOf("PASTE_") === 0);

function announceReady(configured){
  window.dispatchEvent(new CustomEvent("mm-firebase-ready", {detail:{configured}}));
}

if(isPlaceholder){
  console.warn("[MindMate] Firebase is not configured yet. Paste your firebaseConfig into the MINDMATE_FIREBASE_CONFIG block in index.html.");
  const reject = () => Promise.reject({code:"not-configured"});
  window.MMFirebase = {
    configured:false,
    signUp:reject, signIn:reject, signInGoogle:reject,
    resetPassword:reject, signOut:() => Promise.resolve(),
    listPatients:() => Promise.resolve([]), savePatients:() => Promise.resolve(),
    deletePatient:reject
  };
  announceReady(false);
} else {
  try{
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js");
    const {
      getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
      GoogleAuthProvider, signInWithPopup, sendPasswordResetEmail,
      signOut, updateProfile, onAuthStateChanged, setPersistence, browserLocalPersistence
    } = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js");
    const {
      getFirestore, doc, setDoc, getDocs, deleteDoc,
      collection, query, where, serverTimestamp
    } = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js");

    const app  = initializeApp(cfg);
    const auth = getAuth(app);
    const db   = getFirestore(app);
    await setPersistence(auth, browserLocalPersistence);

    const shape = (u) => u ? {
      uid: u.uid,
      email: u.email,
      displayName: u.displayName,
      provider: (u.providerData && u.providerData[0] && u.providerData[0].providerId) || "password"
    } : null;

    async function ensureCaregiverDoc(user, name){
      // Profile only. No password material is ever written here.
      await setDoc(doc(db, "caregivers", user.uid), {
        name: name || user.displayName || "",
        email: user.email || "",
        updatedAt: serverTimestamp()
      }, {merge:true});
    }

    window.MMFirebase = {
      configured: true,

      async signUp(name, email, password){
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        if(name) await updateProfile(cred.user, {displayName:name});
        await ensureCaregiverDoc(cred.user, name);
        return shape(cred.user);
      },

      async signIn(email, password){
        const cred = await signInWithEmailAndPassword(auth, email, password);
        await ensureCaregiverDoc(cred.user);
        return shape(cred.user);
      },

      async signInGoogle(){
        const provider = new GoogleAuthProvider();
        const cred = await signInWithPopup(auth, provider);
        await ensureCaregiverDoc(cred.user);
        return shape(cred.user);
      },

      resetPassword(email){ return sendPasswordResetEmail(auth, email); },
      signOut(){ return signOut(auth); },

      /* Only ever queries this caregiver's own UID; the security rules enforce the
         same constraint server-side, so another caregiver's records are unreachable. */
      async listPatients(uid){
        const snap = await getDocs(query(collection(db, "patients"), where("caregiverId", "==", uid)));
        const out = [];
        snap.forEach(d => {
          const data = d.data() || {};
          delete data.updatedAt;                       // Firestore timestamp, not app data
          out.push(Object.assign({}, data, {id:d.id}));
        });
        return out;
      },

      async savePatients(uid, records){
        await Promise.all((records || []).map(rec => {
          const payload = Object.assign({}, rec, {caregiverId: uid, updatedAt: serverTimestamp()});
          delete payload.id;                           // the id IS the document id
          return setDoc(doc(db, "patients", rec.id), payload, {merge:true});
        }));
      },

      deletePatient(uid, id){ return deleteDoc(doc(db, "patients", id)); }
    };

    onAuthStateChanged(auth, (user) => {
      window.dispatchEvent(new CustomEvent("mm-auth-changed", {detail:{user: shape(user)}}));
    });

    announceReady(true);
  } catch(err){
    console.error("[MindMate] Firebase failed to initialize:", err);
    const reject = () => Promise.reject({code:"not-configured"});
    window.MMFirebase = {
      configured:false,
      signUp:reject, signIn:reject, signInGoogle:reject,
      resetPassword:reject, signOut:() => Promise.resolve(),
      listPatients:() => Promise.resolve([]), savePatients:() => Promise.resolve(),
      deletePatient:reject
    };
    announceReady(false);
  }
}
</script>
